(()=>{'use strict';const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const STORE='snuffx-library-v1',SETTINGS='snuffx-settings-v1';const SUPABASE_URL='https://ylrwccddajsdlgqmdenx.supabase.co',SUPABASE_KEY='sb_publishable_lPl298si5w2EKGsn3BAN3A_hu78bBR5';const sb=window.supabase?.createClient(SUPABASE_URL,SUPABASE_KEY);let cloudUser=null,cloudChannel=null,syncTimer=null,syncBusy=false,loadingCloud=false;let currentPage='home',activeItem=null,playerTimer=null;let items=[],collections=[],settings={theme:'dark'};
const seedCollections=[{id:'col-action',name:'Action',description:'High intensity',color:'red'},{id:'col-horror',name:'Horror',description:'Into the unknown',color:'red'},{id:'col-scifi',name:'Sci-Fi',description:'Beyond reality',color:'blue'}];function load(){try{const d=JSON.parse(localStorage.getItem(STORE)||'{}');items=Array.isArray(d.items)?d.items:[];collections=Array.isArray(d.collections)?d.collections:seedCollections}catch(e){items=[];collections=seedCollections}try{settings={...settings,...JSON.parse(localStorage.getItem(SETTINGS)||'{}')}}catch(e){}applyTheme();}function save(){localStorage.setItem(STORE,JSON.stringify({items,collections}));localStorage.setItem(SETTINGS,JSON.stringify(settings));if(cloudUser&&!loadingCloud){clearTimeout(syncTimer);syncTimer=setTimeout(()=>pushCloud(),500)}}async function pushCloud(){if(!sb||!cloudUser||syncBusy)return;syncBusy=true;try{const payload={user_id:cloudUser.id,items,collections,updated_at:new Date().toISOString()};const {error}=await sb.from('user_libraries').upsert(payload,{onConflict:'user_id'});if(error)throw error;setSyncStatus('Synced to Supabase','success')}catch(e){console.error('SNUFF X cloud sync failed',e);setSyncStatus('Sync error — check Supabase setup','error')}finally{syncBusy=false}}function setSyncStatus(message,state=''){const el=document.querySelector('#syncStatus');if(el){el.textContent=message;el.dataset.state=state}}function mergeById(local,remote){const map=new Map();for(const x of [...(remote||[]),...(local||[])]){if(x&&x.id)map.set(x.id,x)}return [...map.values()]}async function syncFromCloud(){if(!sb||!cloudUser)return;try{const {data,error}=await sb.from('user_libraries').select('items,collections').eq('user_id',cloudUser.id).maybeSingle();if(error)throw error;loadingCloud=true;if(data){items=mergeById(items,data.items);collections=mergeById(collections,data.collections);saveLocalOnly();await pushCloud()}else{await pushCloud()}loadingCloud=false;render();setSyncStatus('Connected · synced','success')}catch(e){loadingCloud=false;console.error(e);setSyncStatus('Could not sync — run SQL setup','error');toast('Supabase sync failed. Check table and RLS setup.')}}function saveLocalOnly(){localStorage.setItem(STORE,JSON.stringify({items,collections}));localStorage.setItem(SETTINGS,JSON.stringify(settings))}async function startCloudSync(){if(!sb)return;const {data}=await sb.auth.getSession();cloudUser=data.session?.user||null;updateAuthUi();if(cloudUser){await syncFromCloud();subscribeCloud()}}function subscribeCloud(){if(!sb||!cloudUser)return;if(cloudChannel)sb.removeChannel(cloudChannel);cloudChannel=sb.channel('snuffx-library-'+cloudUser.id).on('postgres_changes',{event:'*',schema:'public',table:'user_libraries',filter:'user_id=eq.'+cloudUser.id},async payload=>{if(!cloudUser||payload.new?.user_id!==cloudUser.id||syncBusy)return;const row=payload.new;if(row?.items&&row?.collections){loadingCloud=true;items=row.items;collections=row.collections;saveLocalOnly();loadingCloud=false;render();setSyncStatus('Updated from another device','success')}}).subscribe()}function usernameToAuthEmail(raw){const u=String(raw||'').trim().toLowerCase();if(!/^[a-z0-9][a-z0-9._-]{2,23}$/.test(u))throw new Error('Username must be 3–24 characters: letters, numbers, dot, underscore or hyphen.');return u+'@snuffx.invalid'}function updateAuthUi(){const e=document.querySelector('#authStatus');if(e)e.textContent=cloudUser?'Signed in: '+(cloudUser.user_metadata?.username||'Username account'):'Not signed in';const b=document.querySelector('#authAction');if(b)b.textContent=cloudUser?'Sign out':'Sign in / Create account';}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function id(){return 'm'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),260 function classify(raw){let u;try{u=new URL(raw)}catch(e){return {kind:'invalid',label:'Invalid URL',url:raw}}if(!/^https?:$/.test(u.protocol))return {kind:'invalid',label:'Unsupported URL protocol',url:u.href};const host=u.hostname.toLowerCase().replace(/^www\./,'');const path=u.pathname.toLowerCase();if(/\.(mp4|webm|ogv|ogg)(\?.*)?$/.test(path))return {kind:'file',label:'Direct video',url:u.href};if(/\.m3u8$/.test(path))return {kind:'hls',label:'HLS stream',url:u.href};if(/\.mpd$/.test(path))return {kind:'dash',label:'DASH stream',url:u.href};if(host==='x.com'||host==='twitter.com'||host.endsWith('.x.com')||host.endsWith('.twitter.com'))return {kind:'x',label:'X / Twitter',url:u.href};if(host==='vk.com'||host.endsWith('.vk.com')||host==='vkvideo.ru'||host.endsWith('.vkvideo.ru')||host==='vk.ru'||host.endsWith('.vk.ru'))return {kind:'vk',label:'VK Video',url:u.href};if(host==='youtube.com'||host==='youtu.be'||host.endsWith('.youtube.com'))return {kind:'youtube',label:'YouTube',url:u.href};if(host==='vimeo.com'||host.endsWith('.vimeo.com'))return {kind:'vimeo',label:'Vimeo',url:u.href};return {kind:'web',label:'Website / player unknown',url:u.href}}

function bindAddForm(){const url=$('#sourceUrl'),preview=$('#urlPreview'),title=$('#sourceTitle'),poster=$('#sourcePoster'),posterStatus=$('#posterStatus');let posterTimer=null,lastPosterLookup='';async function autoPoster(raw){const normalized=normalizeUrl(raw);if(!normalized||normalized===lastPosterLookup||poster.value.trim())return;lastPosterLookup=normalized;posterStatus.textContent='Looking for a public poster/thumbnail…';try{const response=await fetch('https://api.microlink.io/?url='+encodeURIComponent(normalized)+'&meta=false',{headers:{'Accept':'application/json'}});if(!response.ok)throw new Error();const result=await response.json(),imageUrl=result?.data?.image?.url;if(imageUrl&&/^https?:\/\//i.test(imageUrl)&&!poster.value.trim()&&normalizeUrl(url.value)===normalized){poster.value=imageUrl;posterStatus.textContent='Poster found automatically. You can replace it.';return}throw new Error()}catch(err){posterStatus.textContent='No public poster found. You can paste an image URL manually.'}}url.addEventListener('input',()=>{if(!url.value){preview.style.display='none';return}const c=classify(normalizeUrl(url.value));preview.style.display='block';preview.className='notice';preview.innerHTML=`Detected type: <b>${esc(c.label)}</b>. Websites such as YouTube open on the original site; direct video URLs may play here.`;if(!title.value)title.value=titleFromUrl(c.url);clearTimeout(posterTimer);posterTimer=setTimeout(()=>autoPoster(url.value),900)});poster.addEventListener('input',()=>{if(poster.value.trim())posterStatus.textContent='Using the poster URL you entered.'});$('#addForm').addEventListener('submit',e=>{e.preventDefault();const c=classify(normalizeUrl(url.value));if(c.kind==='invalid'){toast('Please enter a valid URL');return}const collection=$('#sourceCollection').value;items.unshift({id:id(),url:c.url,sourceMode:'url',title:title.value.trim()||titleFromUrl(c.url),poster:poster.value.trim(),category:$('#sourceCategory').value.trim()||'Unsorted',notes:$('#sourc function startPlayback(item,c){const stage=$('#playerStage'),status=$('#playStatus'),notice=$('#playerNotice');stage.innerHTML='';if(['file','hls','dash'].includes(c.kind)){status.className='status';status.textContent='LOADING';notice.className='notice';notice.textContent='Loading direct video URL. Playback depends on browser and source-server support.';const video=document.createElement('video');video.controls=true;video.playsInline=true;video.preload='metadata';video.style.cssText='width:100%;height:100%;position:absolute;inset:0;object-fit:contain';stage.appendChild(video);if(c.kind==='file')video.src=c.url;else if(c.kind==='hls'&&video.canPlayType('application/vnd.apple.mpegurl'))video.src=c.url;else{const script=document.createElement('script');script.src=c.kind==='hls'?'https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js':'https://cdn.dashjs.org/latest/dash.all.min.js';script.onload=()=>{if(c.kind==='hls'&&window.Hls&&window.Hls.isSupported()){const h=new window.Hls();h.loadSource(c.url);h.attachMedia(video);h.on(window.Hls.Events.ERROR,(_,d)=>{if(d.fatal)fail('HLS playback failed. The source may block CORS or be unavailable.')})}else if(c.kind==='dash'&&window.dashjs){const p=window.dashjs.MediaPlayer().create();p.initialize(video,c.url,false);p.on(window.dashjs.MediaPlayer.events.ERROR,()=>fail('DASH playback failed. The source may require authentication or CORS access.'))}else fail('This browser cannot play this stream format.')};script.onerror=()=>fail('Could not load the playback library. Check internet access.');document.head.appendChild(script)}function fail(msg){status.textContent='OPEN SOURCE';status.className='status warn';notice.className='notice bad';notice.textContent=msg+' Use Open Source to visit the original website.'}video.addEventListener('loadedmetadata',()=>{status.textContent='MEDIA LOADED';status.className='status ok';item.duration=Number.isFinite(video.duration)?video.duration:0;if(item.position>0&&item.position<item.duration)video.currentTime=item.position;save()});video.addEventListener('playing',()=>{status.textContent='PLAYING';status.className='status ok';notice.className='notice good';notice.textContent='Direct video playback started.'});video.addEventListener('timeupdate',()=>{item.position=video.currentTime;item.duration=Number.isFinite(video.duration)?video.duration:item.duration;item.updatedAt=Date.now();if(!playerTimer)playerTimer=setInterval(save,5000)});video.addEventListener('ended',()=>{item.position=0;save();status.textContent='COMPLETED'});video.addEventListener('error',()=>fail('The browser could not load this video URL. Check the URL, codec, CORS, or source availability.'));return}if(c.kind==='youtube'){let videoId='';try{const u=new URL(item.url);if(u.hostname==='youtu.be')videoId=u.pathname.split('/').filter(Boolean)[0]||'';else if(u.pathname==='/watch')videoId=u.searchParams.get('v')||'';else{const m=u.pathname.match(/^\/(?:shorts|embed|live|v)\/([^/?]+)/);if(m)videoId=m[1]}}catch(e){}if(videoId){const frame=document.createElement('iframe');const params=new URLSearchParams({playsinline:'1',rel:'0'});if(location.origin&&location.origin!=='null'&&/^https?:$/.test(location.protocol))params.set('origin',location.origin);frame.src='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(videoId)+'?'+params.toString();frame.title=item.title||'YouTube video';frame.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';frame.allowFullscreen=true;frame.referrerPolicy='strict-origin-when-cross-origin';frame.style.cssText='position:absolute;inset:0;width:100%;height:100%;border:0';stage.appendChild(frame);status.className='status';status.textContent='YOUTUBE PLAYER';notice.className='notice';notice.textContent='YouTube playback is embedded here when the video owner and YouTube allow it. If blocked, use Open Original Source.';const fallback=document.createElement('button');fallback.className='btn primary';fallback.textContent function editItem(item){showModal('Edit Library Item',`<form id="editForm"><div class="field"><label>Title *</label><input id="editTitle" value="${esc(item.title)}" required></div><div class="field"><label>Source URL *</label><input id="editUrl" type="url" value="${esc(item.url)}" required></div><div class="field"><label>Poster image URL</label><input id="editPoster" type="url" value="${esc(item.poster||'')}"></div><div class="field"><label>Category</label><input id="editCategory" value="${esc(item.category||'')}"></div><div class="field"><label>Collection</label><select id="editCollection"><option value="">No collection</option>${collections.map(c=>`<option value="${esc(c.id)}" ${(item.collectionIds||[]).includes(c.id)?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Private notes</label><textarea id="editNotes">${esc(item.notes||'')}</textarea></div><div class="actions"><button class="btn primary" type="submit">Save Changes</button></div></form>`);$('#editForm').onsubmit=e=>{e.preventDefault();const nextUrl=normalizeUrl($('#editUrl').value);const parsed=classify(nextUrl);if(parsed.kind==='invalid'){toast('Please enter a valid source URL');return}item.title=$('#editTitle').value.trim();item.url=parsed.url;item.poster=$('#editPoster').value.trim();item.category=$('#editCategory').value.trim()||'Unsorted';item.notes=$('#editNotes').value.trim();item.sourceType=parsed.kind;item.sourceLabel=parsed.label;item.sourceMode='url';delete item.embedUrl;const cid=$('#editCollection').value;item.collectionIds=cid?[cid]:[];save();closeModal();if(currentPage==='watch')renderWatch(item);else render();toast('Item updated') }}
function showModal(title,body){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modalBackdrop').classList.add('open')}function closeModal(){$('#modalBackdrop').classList.remove('open')}function newCollection(existing){showModal(existing?'Edit Collection':'New Collection',`<form id="collectionForm"><div class="field"><label>Name *</label><input id="colName" required value="${esc(existing?.name||'')}"></div><div class="field"><label>Description</label><input id="colDesc" value="${esc(existing?.description||'')}"></div><div class="actions"><button class="btn primary" type="submit">Save Collection</button>${existing?'<button class="btn" type="button" id="deleteCollection" style="color:#ff9aa7">Delete</button>':''}</div></form>`);$('#collectionForm').onsubmit=e=>{e.preventDefault();const name=$('#colName').value.trim();if(!name)return;if(existing){existing.name=name;existing.description=$('#colDesc').value.trim()}else collections.push({id:id(),name,description:$('#colDesc').value.trim()});save();closeModal();render();toast('Collection saved')};if(existing)$('#deleteCollection').onclick=()=>{if(confirm('Delete collection? Items will remain in your library.')){collections=collections.filter(c=>c.id!==existing.id);items.forEach(i=>i.collectionIds=(i.collectionIds||[]).filter(x=>x!==existing.id));save();closeModal();render()}}}
function bindAdmin(){updateAuthUi();$('#signInBtn').onclick=async()=>{if(!sb){toast('Supabase client did not load');return}let email;try{email=usernameToAuthEmail($('#authUsername').value)}catch(err){toast(err.message);return}const password=$('#authPassword').value;if(!password){toast('Enter your username and password');return}const {data,error}=await sb.auth.signInWithPassword({email,password});if(error){toast(error.message);return}cloudUser=data.user;updateAuthUi();await syncFromCloud();subscribeCloud();toast('Signed in and sync started')};$('#signUpBtn').onclick=async()=>{if(!sb){toast('Supabase client did not load');return}let email,username=$('#authUsername').value.trim().toLowerCase();try{email=usernameToAuthEmail(username)}catch(err){toast(err.message);return}const password=$('#authPassword').value;if(password.length<8){toast('Use a password of at least 8 characters');return}const {data,error}=await sb.auth.signUp({email,password,options:{data:{username}}});if(error){toast(error.message);return}if(data.session){cloudUser=data.user;updateAuthUi();await syncFromCloud();subscribeCloud();toast('Account created and sync started')}else toast('Account created. If Supabase requires confirmation, disable email confirmations for this username-only setup, then sign in.')};$('#authAction').onclick=async()=>{if(cloudUser){await sb.auth.signOut();cloudUser=null;if(cloudChannel)sb.removeChannel(cloudChannel);updateAuthUi();setSyncStatus('Signed out · local data remains on this device');toast('Signed out')}else toast('Enter username and password, then choose Sign In or Create Account')};$('#adminTheme').onclick=setTheme;$('#exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),items,collections},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='snuff-x-library-backup.json';a.click();URL.revokeObjectURL(a.href);toast('Backup exported')};$('#importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.items)||!Array.isArray(d.collections))throw new Error('Invalid backup');if(confirm('Replace the current local library with this backup?')){items=d.items;collections=d.collections;save();render();toast('Backup imported')}}catch(err){toast('Could not import: invalid JSON backup')}e.target.value=''};$('#clearProgress').onclick=()=>{if(confirm('Clear all saved watch progress?')){items.forEach(i=>{i.position=0;i.duration=0;i.updatedAt=0});save();render();toast('Watch progress cleared')}};$('#deleteAll').onclick=()=>{if(confirm('Permanently remove all items from this browser library? Export a backup first if needed.')){items=[];save();render();toast('Library cleared')}}}
function showCollection(cid){const c=collections.find(x=>x.id===cid);if(!c)return;const arr=items.filter(i=>(i.collectionIds||[]).includes(cid));$('#view').innerHTML=`<button class="btn" data-go="collections">← Collections</button>${header(c.name,c.description||'Your private collection')}<div class="toolbar"><button class="btn" data-edit-collection="${esc(c.id)}">✎ Edit Collection</button></div>${movieGrid(arr)}`}
function handleClick(e){const edit=e.target.closest('[data-edit-item]');if(edit){e.preventDefault();e.stopPropagation();const target=items.find(x=>x.id===edit.dataset.editItem);if(target)editItem(target);return}const del=e.target.closest('[data-delete-item]');if(del){e.preventDefault();e.stopPropagation();const target=items.find(x=>x.id===del.dataset.deleteItem);if(target&&confirm('Delete “'+target.title+'” from your local library?')){items=items.filter(x=>x.id!==target.id);if(activeItem&&activeItem.id===target.id)activeItem=null;save();render();toast('Video deleted from library')}return}const page=e.target.closest('[data-page]');if(page){go(page.dataset.page);return}const goEl=e.target.closest('[data-go]');if(goEl){go(goEl.dataset.go);return}const open=e.target.closest('[data-open]');if(open){openItem(open.dataset.open);return}const col=e.target.closest('[data-collection]');if(col){showCollection(col.dataset.collection);return}const editCol=e.target.closest('[data-edit-collection]');if(editCol){newCollection(collections.find(c=>c.id===editCol.dataset.editCollection));return}const act=e.target.closest('[data-action]');if(act?.dataset.action==='new-collection'){newCollection();return}}
document.addEventListener('click',handleClick);$('#themeSwitch').addEventListener('change',setTheme);$('#themeQuick').onclick=setTheme;$('#fullBtn').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};$('#modalClose').onclick=closeModal;$('#modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});$('#globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){const value=e.target.value.trim();if(/^https?:\/\//i.test(value)||value.includes('.')){$('#globalSearch').value='';go('add');setTimeout(()=>{$('#sourceUrl').value=value;$('#sourceUrl').dispatchEvent(new Event('input'));},0)}else{go('library');setTimeout(()=>{const q=$('#libSearch');if(q){q.value=value;q.dispatchEvent(new Event('input'))}},0)}}});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#globalSearch').focus()}});load();render();startCloudSync();sb?.auth.onAuthStateChange((_event,session)=>{cloudUser=session?.user||null;updateAuthUi();if(cloudUser){syncFromCloud();subscribeCloud()}else{if(cloudChannel)sb.removeChannel(cloudChannel);cloudChannel=null}});
})();
</script>
</body></html>
